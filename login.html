<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimamiaKanisa - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold:    #c9a84c;
            --gold-lt: #e8c97a;
            --dark:    #0f1117;
            --surface: #181c26;
            --border:  #252a38;
            --text:    #e8e6df;
            --muted:   #7a7f8e;
            --green:   #2d7a52;
            --red:     #c0392b;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* decorative background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,.12) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 90% 100%, rgba(201,168,76,.06) 0%, transparent 50%);
            pointer-events: none;
        }

        /* grid pattern */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg,   transparent, transparent 39px, rgba(201,168,76,.04) 39px, rgba(201,168,76,.04) 40px),
                repeating-linear-gradient(90deg,  transparent, transparent 39px, rgba(201,168,76,.04) 39px, rgba(201,168,76,.04) 40px);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        /* ── brand ── */
        .brand {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown .6s ease both;
        }
        .brand-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--gold), var(--gold-lt));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(201,168,76,.25);
        }
        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: -.5px;
            margin-bottom: 6px;
        }
        .brand p { color: var(--muted); font-size: 14px; font-weight: 300; }

        /* ── card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            animation: fadeUp .5s .1s ease both;
        }

        /* ── church badge ── */
        .church-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(201,168,76,.08);
            border: 1px solid rgba(201,168,76,.2);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--gold);
            font-weight: 500;
        }

        /* ── alerts ── */
        .alert {
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show   { display: block; }
        .alert-err    { background: rgba(192,57,43,.15); border: 1px solid rgba(192,57,43,.4); color: #e57373; }
        .alert-ok     { background: rgba(45,122,82,.15);  border: 1px solid rgba(45,122,82,.4);  color: #81c995; }

        /* ── form ── */
        .field { margin-bottom: 20px; }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            background: var(--dark);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            padding: 13px 16px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,168,76,.1);
        }

        .show-pw {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            font-weight: 400;
            user-select: none;
        }
        .show-pw input[type="checkbox"] { width: auto; accent-color: var(--gold); cursor: pointer; }

        /* remember / forgot row */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] { width: auto; accent-color: var(--gold); cursor: pointer; }
        .forgot-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            transition: opacity .2s;
        }
        .forgot-link:hover { opacity: .75; text-decoration: underline; }

        /* ── submit button ── */
        .btn-gold {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-lt));
            color: #0f1117;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s, transform .1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-gold:hover   { opacity: .9; }
        .btn-gold:active  { transform: scale(.98); }
        .btn-gold:disabled{ opacity: .4; cursor: not-allowed; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #0f1117;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        .loading .spinner { display: block; }

        /* ── divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--border);
        }

        /* ── footer links ── */
        .footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
            line-height: 2;
            animation: fadeUp .5s .2s ease both;
        }
        .footer-links a { color: var(--gold); text-decoration: none; font-weight: 500; }
        .footer-links a:hover { text-decoration: underline; }

        /* ── animations ── */
        @keyframes fadeDown { from { opacity:0; transform: translateY(-16px); } to { opacity:1; transform: none; } }
        @keyframes fadeUp   { from { opacity:0; transform: translateY(16px);  } to { opacity:1; transform: none; } }
        @keyframes spin     { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<div class="page">

    <!-- Brand -->
    <div class="brand">
        <div class="brand-icon">⛪</div>
        <h1>SimamiaKanisa</h1>
        <p>Church Management System</p>
    </div>

    <!-- Card -->
    <div class="card">

        <!-- Church badge -->
        <div class="church-badge" id="churchBadge" style="display:none">
            <span>⛪</span>
            <span id="churchBadgeText">Loading…</span>
        </div>

        <div class="alert alert-err" id="alertErr"></div>
        <div class="alert alert-ok"  id="alertOk"></div>

        <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="pastor@church.org" required>
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <label class="show-pw">
                <input type="checkbox" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
                Show password
            </label>
        </div>

        <div class="remember-forgot">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe"> Remember me
            </label>
            <a href="#" class="forgot-link" onclick="handleForgotPassword(); return false;">Forgot password?</a>
        </div>

        <button class="btn-gold" id="submitBtn" onclick="handleLogin()">
            <div class="spinner" id="spinner"></div>
            <span id="btnLabel">Sign In</span>
        </button>

        <div class="divider">or</div>

        <div style="text-align:center;font-size:13px;color:var(--muted)">
            New church admin? <a href="register-church.html" style="color:var(--gold);font-weight:500;text-decoration:none">Register your church →</a>
        </div>

    </div><!-- /.card -->

    <div class="footer-links">
        <div>Don't have a staff account? <a id="registerLink" href="register.html">Register here</a></div>
        <div style="margin-top:4px;font-size:11px;opacity:.5">Your data is isolated and secure per church</div>
    </div>

</div>

<script>
// ── Tenant resolution ──────────────────────────────────────────────────────────
const params   = new URLSearchParams(window.location.search);
const tenantId = params.get('tenant') || localStorage.getItem('simamia_tenant');

if (tenantId) {
    localStorage.setItem('simamia_tenant', tenantId);
    document.getElementById('registerLink').href = `register.html?tenant=${tenantId}`;

    const badge = document.getElementById('churchBadge');
    badge.style.display = 'flex';

    db.collection('tenants').doc(tenantId).get()
        .then(doc => {
            const name = doc.exists ? doc.data().name : tenantId;
            document.getElementById('churchBadgeText').textContent = name;
            document.title = `Login — ${name}`;
        })
        .catch(() => {
            document.getElementById('churchBadgeText').textContent = tenantId;
        });
}

// ── UI helpers ─────────────────────────────────────────────────────────────────
function showError(msg) {
    const el = document.getElementById('alertErr');
    el.textContent = '⚠ ' + msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 5000);
}

function showSuccess(msg) {
    document.getElementById('alertOk').textContent = '✅ ' + msg;
    document.getElementById('alertOk').classList.add('show');
}

function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = on;
    btn.classList.toggle('loading', on);
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
    document.getElementById('btnLabel').textContent  = on ? 'Signing in…' : 'Sign In';
}

// ── Login ──────────────────────────────────────────────────────────────────────
async function handleLogin() {
    document.getElementById('alertErr').classList.remove('show');
    document.getElementById('alertOk').classList.remove('show');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { showError('Please enter your email and password.'); return; }

    setLoading(true);

    try {
        // loginUser is defined in auth.js and handles tenant verification + redirect
        await loginUser(email, password);
    } catch (error) {
        const messages = {
            'auth/user-not-found':         'No account found with this email.',
            'auth/wrong-password':         'Incorrect password.',
            'auth/invalid-email':          'Invalid email address.',
            'auth/user-disabled':          'This account has been disabled.',
            'auth/too-many-requests':      'Too many failed attempts. Try again later.',
            'auth/network-request-failed': 'Network error. Check your connection.',
            'auth/invalid-credential':     'Email or password is incorrect.'
        };
        showError(messages[error.code] || error.message);
        setLoading(false);
    }
}

// ── Forgot password ────────────────────────────────────────────────────────────
async function handleForgotPassword() {
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Enter your email address first, then click Forgot password.'); return; }
    try {
        await auth.sendPasswordResetEmail(email);
        showSuccess('Reset email sent — check your inbox.');
    } catch {
        showError('Could not send reset email. Check the address and try again.');
    }
}

// ── Enter key ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
});
</script>

</body>
</html>
