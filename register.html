<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimamiaKanisa - Register</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .login-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
        animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .logo-container {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo-container img {
        width: 80px;
        height: 80px;
        margin-bottom: 15px;
    }

    h2 {
        text-align: center;
        color: #1f2937;
        margin-bottom: 10px;
        font-size: 28px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        color: #6b7280;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-weight: 500;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s;
        background: #f9fafb;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-container {
        position: relative;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: #6b7280;
        padding: 4px;
    }

    .remember-forgot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #374151;
    }

    .remember-me input[type="checkbox"] {
        width: auto;
        margin: 0;
    }

    .forgot-link {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }

    .forgot-link:hover {
        color: #1e40af;
        text-decoration: underline;
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
    }

    .link {
        text-align: center;
        margin-top: 20px;
        color: #6b7280;
        font-size: 14px;
    }

    .link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
    }

    .link a:hover {
        color: #1e40af;
        text-decoration: underline;
    }

    .error-message {
        background: #fee2e2;
        color: #dc2626;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        border-left: 4px solid #dc2626;
    }

    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #9ca3af;
        font-size: 13px;
    }

    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e5e7eb;
    }

    .divider span {
        padding: 0 10px;
    }
    .register-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px;
        animation: slideIn 0.5s ease-out;
    }

    select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s;
        background: #f9fafb;
        cursor: pointer;
    }

    select:focus {
        outline: none;
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .success-message {
        background: #d1fae5;
        color: #059669;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
        border-left: 4px solid #059669;
    }

    .loading {
        display: none;
        text-align: center;
        margin: 10px 0;
    }

    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #2563eb;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .password-strength {
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
    }

    .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s;
        border-radius: 2px;
    }

    .strength-weak {
        background: #ef4444;
        width: 33%;
    }

    .strength-medium {
        background: #f59e0b;
        width: 66%;
    }

    .strength-strong {
        background: #10b981;
        width: 100%;
    }

    .requirements {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
    }

    .requirement {
        margin: 4px 0;
    }

    .requirement.met {
        color: #10b981;
    }

    .requirement::before {
        content: "○ ";
        margin-right: 4px;
    }

    .requirement.met::before {
        content: "✓ ";
    }
</style>
</head>
<body>
    <div class="register-container">
        <div class="logo-container">
            <img src="images/dove-fig.png" alt="SimamiaKanisa Logo" onerror="this.style.display='none'">
            <h2>Create Account</h2>
            <p class="subtitle">Join SimamiaKanisa Church Management</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #6b7280;">Creating your account...</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="email"> Email Address *</label>
                <input type="email" id="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password"> Password *</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter strong password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                </div>
                <div class="password-strength">
                    <div id="passwordStrengthBar" class="password-strength-bar"></div>
                </div>
                <div class="requirements">
                    <div id="req-length" class="requirement">At least 6 characters</div>
                    <div id="req-upper" class="requirement">One uppercase letter</div>
                    <div id="req-number" class="requirement">One number</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"> Confirm Password *</label>
                <div class="password-container">
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="role"> Role *</label>
                <select id="role">
                    <option value="user">User (Read Only)</option>
                    <option value="editor">Editor (Can Add/Edit)</option>
                    <option value="admin">Admin (Full Access)</option>
                </select>
                <p style="font-size: 12px; color: #6b7280; margin-top: 4px;">
                    ℹ️ Select appropriate role for church member
                </p>
            </div>

            <button type="submit" id="registerBtn">
                 Create Account
            </button>
        </form>

        <div class="link">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Your Firebase config and auth -->
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <script>
        const form = document.getElementById('registerForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const roleSelect = document.getElementById('role');
        const registerBtn = document.getElementById('registerBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loading = document.getElementById('loading');

        // Password strength checker
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            
            let strength = 0;
            if (password.length >= 6) {
                strength++;
                document.getElementById('req-length').classList.add('met');
            } else {
                document.getElementById('req-length').classList.remove('met');
            }
            
            if (/[A-Z]/.test(password)) {
                strength++;
                document.getElementById('req-upper').classList.add('met');
            } else {
                document.getElementById('req-upper').classList.remove('met');
            }
            
            if (/[0-9]/.test(password)) {
                strength++;
                document.getElementById('req-number').classList.add('met');
            } else {
                document.getElementById('req-number').classList.remove('met');
            }

            strengthBar.className = 'password-strength-bar';
            if (strength === 1) strengthBar.classList.add('strength-weak');
            else if (strength === 2) strengthBar.classList.add('strength-medium');
            else if (strength === 3) strengthBar.classList.add('strength-strong');
        });

        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const button = field.nextElementSibling;
            
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
            } else {
                field.type = 'password';
                button.textContent = '👁️';
            }
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const role = roleSelect.value;

            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Validation
            if (!email || !password || !confirmPassword) {
                showError('Please fill in all required fields');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match!');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating Account...';

            // Register user
            registerUser(email, password, role);
        });

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = '✅ ' + message;
            successMessage.style.display = 'block';
        }

        // Override registerUser to add UI feedback
        const originalRegisterUser = window.registerUser;
        window.registerUser = function(email, password, role) {
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("User registered:", user.uid);

                    return db.collection("users").doc(user.uid).set({
                        email: email,
                        role: role,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        active: true
                    });
                })
                .then(() => {
                    console.log("User data saved successfully");
                    loading.style.display = 'none';
                    showSuccess('Account created successfully! Redirecting to login...');
                    
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);
                })
                .catch((error) => {
                    console.error("Registration error:", error.message);
                    loading.style.display = 'none';
                    registerBtn.disabled = false;
                    registerBtn.textContent = ' Create Account';
                    
                    let errorMsg = "Registration failed. ";
                    switch(error.code) {
                        case 'auth/email-already-in-use':
                            errorMsg += "This email is already registered.";
                            break;
                        case 'auth/invalid-email':
                            errorMsg += "Invalid email address.";
                            break;
                        case 'auth/weak-password':
                            errorMsg += "Password is too weak.";
                            break;
                        default:
                            errorMsg += error.message;
                    }
                    showError(errorMsg);
                });
        };
    </script>
</body>
</html>
